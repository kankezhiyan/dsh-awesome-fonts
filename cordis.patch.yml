# dsh-awesome-fonts profile patch layer — insert one loader entry for the
# plugin package. The entry is a normal cordis loader entry (id + package name);
# the browser half is picked up by dsh-client-modules through the package's
# dsh.client declaration, exactly like the shipped ui-* packages. The package
# name must match the dependency installed in the profile, so this row only
# resolves once `dsh plugin --profile <name> add` has linked the package.
- insert:
    - id: dsh-awesome-fonts
      name: 'dsh-awesome-fonts'
